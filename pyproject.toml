[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flyssh-mcp"
version = "1.0.0"
description = "stdio MCP server for password-authenticated remote machine operations via plink (Windows) / sshpass (WSL)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "flyvu" }]
dependencies = [
    "mcp>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
flyssh-mcp = "flyssh_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
